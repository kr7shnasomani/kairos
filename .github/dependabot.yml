# Dependabot version updates for Kairos — one entry per ecosystem/manifest location.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# SCHEDULING — read before "why isn't this running on push?":
#   `interval` accepts only daily / weekly / monthly. Dependabot version updates have NO event
#   trigger: they cannot run on push, and there is no API to force a run (the "Check for updates"
#   button is UI-only, under Insights -> Dependency graph -> Dependabot). `daily` is the ceiling.
#   For an actual per-push dependency check, see .github/workflows/deps-audit.yml, which runs
#   pip-audit / npm audit / govulncheck on every push and PR to main.
#
# GROUPS HOLD MINOR AND PATCH ONLY (2026-10-09):
#   Each group used to take every update, so one breaking major (the Elasticsearch 9 client against
#   an 8.13 server, vitest 5 needing Node 22) made the whole group PR fail and blocked the safe bumps
#   in it for weeks. A group is now minor + patch, which should stay green and mergeable; a major
#   arrives as its own PR and is a decision, not a chore.
#
#
# COOLDOWN (2026-10-24, README.md > Supply-Chain Security):
#   A version update is proposed only once the release is 7 days old, by which time a hijacked
#   release is usually pulled. pip, npm and gomod also wait 14 days for a major. docker and
#   github-actions accept only `default-days` (the validator rejects semver-*-days there).
#   Security updates ignore the cooldown by design.
#
# WHY NEW PRs MAY NOT APPEAR EVEN THOUGH IT IS RUNNING:
#   Every ecosystem below groups all patterns into ONE PR. While that group PR is open, Dependabot
#   REBASES it in place rather than opening another — so a working setup looks idle from the PR
#   list. Merge or close the open group PR and the next run opens a fresh one.
version: 2
updates:
  # --- Python (backend API + workers) ---
  # requirements.in is the source; requirements.txt is its hashed pip-compile lock, which
  # Dependabot recompiles (hashes included) from the command in the lock's header.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- npm (Next.js frontend) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Go modules (OT connector) ---
  - package-ecosystem: "gomod"
    directory: "/backend/connectors"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Docker base images (one per Dockerfile) ---
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/backend/connectors"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # The frontend image stays on the Node 24 LTS line, as CI and Vercel do. Moving the runtime is
      # one decision for all three places, not a base-image bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- GitHub Actions (all workflows) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
