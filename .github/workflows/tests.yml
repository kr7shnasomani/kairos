name: Tests

# Least-privilege default for all jobs — read-only access to repo contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '!backend/connectors/**'
      - 'tests/**'
      - 'db/**'
      - 'fixtures/**'
      - 'docker-compose.yml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '!backend/connectors/**'
      - 'tests/**'
      - 'db/**'
      - 'fixtures/**'
      - 'docker-compose.yml'
      - '.github/workflows/tests.yml'

jobs:
  # ===========================================================================
  # Tier 1 — unit tests. No services, no secrets, no network.
  # Always runs, on every push and fork PR. This is the gate that must stay green.
  # ===========================================================================
  unit:
    name: Unit (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Layer cache keyed on requirements.txt: the pip install dominates the build, and it
      # only changes when dependencies do. Cache hit takes this job from ~4 min to ~40 s.
      - uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/requirements.txt', 'backend/Dockerfile') }}
          restore-keys: ${{ runner.os }}-backend-

      # docker-compose.yml declares `env_file: [.env]`, so compose refuses to run without
      # the file even for a job that needs no credentials. The example's defaults are enough.
      - name: Create .env (no credentials needed)
        run: cp .env.example .env

      - name: Build API image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag kairos-backend:local --load backend
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Pure-logic suites: PII redaction, safety-critical query classification, retrieval
      # fusion, spreadsheet/email ingestion, NER span matching, P&ID parsing, auth cache,
      # config guardrails, the authorization boundary, and the conformance suites (PTW
      # countersignature, topology verification, OT coverage, phase gate, extraction path,
      # timestamp alignment, model-gate classes, NER parsing, superseded filter, brief
      # signing, attribution evidence). None touch a datastore or a model provider.
      #
      # This list must stay identical to the service-free tier documented in AGENTS.md and
      # docs/TESTS.md. It previously held only the first nine files, so eleven service-free
      # suites — every conformance test among them — were documented as CI-gated but never
      # actually ran on a push.
      - name: Run unit tests
        run: |
          docker compose run --rm --no-deps \
            -e KAIROS_SKIP_TEST_CLEANUP=1 \
            kairos-backend-api pytest -q --timeout=120 \
              tests/test_pii.py \
              tests/test_query_category.py \
              tests/test_search_fusion.py \
              tests/test_ingestion_formats.py \
              tests/test_http_pool.py \
              tests/test_model_validation.py \
              tests/test_pid.py \
              tests/test_auth_cache.py \
              tests/test_config_guardrail.py \
              tests/test_briefs_countersign.py \
              tests/test_topology_verify.py \
              tests/test_ot_coverage.py \
              tests/test_phase_gate.py \
              tests/test_extraction_path.py \
              tests/test_timestamp_alignment.py \
              tests/test_model_gate_classes.py \
              tests/test_ner_parse.py \
              tests/test_superseded_filter.py \
              tests/test_brief_signing.py \
              tests/test_attribution_evidence.py \
              tests/test_authz_boundary.py \
              tests/test_brief_paging.py \
              tests/test_asset_bulk_import.py \
              tests/test_quarantine_item_id.py \
              tests/test_purge_safety.py \
              tests/test_synthesis_stream.py \
              tests/test_graph_query_policy.py \
              tests/test_event_reorder.py \
              tests/test_supply_chain.py \
              tests/test_form_extraction.py \
              tests/test_cross_functional.py \
              tests/test_offboarding_session_id.py \
              tests/test_corpus_filter.py \
              tests/test_alias_expansion.py \
              tests/test_ner_fallback.py \
              tests/test_asset_tag_filter.py \
              tests/test_linked_document_scope.py \
              tests/test_nim_retry.py \
              tests/test_rca_timeline.py \
              tests/test_audit_evidence.py \
              tests/test_document_extraction_view.py \
              tests/test_image_utils.py \
              tests/test_ocr_review_release.py \
              tests/test_supabase_http.py

      # The benchmark grader is deterministic logic (negation handling, Wilson intervals, the
      # run-validity verdict) and needs no stack, no secrets and no network — so it belongs in
      # tier 1. It is worth gating because it can rot silently: a broken negation guard would
      # not fail any test, it would just quietly inflate the published answer-quality figure.
      - name: Benchmark grader selftest
        run: |
          docker compose run --rm --no-deps \
            kairos-backend-api python benchmark/run_benchmark.py --selftest

  # ===========================================================================
  # Tier 2 — full integration suite against LOCAL stores.
  #
  # DO NOT point this at the production Supabase / Neo4j Aura / Qdrant Cloud project.
  # The suite creates and then purges test entities, `make init-all` reinitialises schema
  # and Qdrant collections, and the teardown purge is unreliable against cloud Supabase.
  # Wiring production credentials here would corrupt the golden demo dataset on every push.
  #
  # Neo4j, Qdrant, Elasticsearch and Redis all run as local containers, so they need no
  # secrets. Supabase has no local container, so this job needs a SEPARATE, throwaway
  # Supabase project — hence the CI_ prefix on those secret names.
  #
  # Absent those secrets the job reports "skipped" and exits 0 rather than failing, so a
  # missing optional credential never shows up as a red build.
  # ===========================================================================
  integration:
    name: Integration (local stores)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `secrets` is unavailable in a job-level `if`, so gate on an output instead.
      - name: Check for CI credentials
        id: gate
        env:
          CI_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
        run: |
          if [ -n "$CI_SUPABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Integration tests skipped::CI_SUPABASE_URL is not set. Tier-1 unit tests still ran. See .github/workflows/tests.yml for the required CI-only secrets."
          fi

      # Local stores get local addresses. .env.example ships NEO4J_URI=bolt://localhost:7687
      # for host-run scripts, which is unreachable from inside the compose network — so the
      # container-visible service names are set explicitly here.
      - name: Create .env
        if: steps.gate.outputs.ready == 'true'
        env:
          CI_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
          CI_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
          CI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
          CI_SUPABASE_JWT_SECRET: ${{ secrets.CI_SUPABASE_JWT_SECRET }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cp .env.example .env
          {
            echo "NEO4J_URI=neo4j://kairos-neo4j:7687"
            echo "NEO4J_USERNAME=neo4j"
            echo "NEO4J_PASSWORD=kairos_dev_password"
            echo "NEO4J_LOCAL_PASSWORD=kairos_dev_password"
            echo "NEO4J_DATABASE=neo4j"
            echo "QDRANT_URL=http://kairos-qdrant:6333"
            echo "QDRANT_API_KEY="
            echo "SUPABASE_URL=${CI_SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${CI_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${CI_SUPABASE_SERVICE_ROLE_KEY}"
            echo "SUPABASE_JWT_SECRET=${CI_SUPABASE_JWT_SECRET}"
            echo "NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}"
            echo "JINA_API_KEY=${JINA_API_KEY}"
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
          } >> .env

      - name: Start services (local stores)
        if: steps.gate.outputs.ready == 'true'
        run: docker compose --profile local-stores up -d --build

      - name: Wait for API
        if: steps.gate.outputs.ready == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API ready (${i}x10s)"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy — dumping logs"
          docker compose --profile local-stores logs kairos-backend-api
          exit 1

      - name: Initialise databases
        if: steps.gate.outputs.ready == 'true'
        run: make init-all

      - name: Seed test users
        if: steps.gate.outputs.ready == 'true'
        run: docker compose exec -T kairos-backend-api python scripts/seed_users.py

      - name: Run test suite
        if: steps.gate.outputs.ready == 'true'
        run: docker compose exec -T kairos-backend-api python -m pytest tests/ -q --timeout=120

      # ---------------------------------------------------------------------
      # Metric regression gates — DETERMINISTIC HARNESSES ONLY.
      #
      # What is gated: layer reachability (13 cheap GETs) and compliance gap-detection
      # accuracy (pure Cypher against the seeded graph). Both are reproducible: compliance
      # returned precision 1.000 / recall 0.973 / F1 0.986 identically on 2026-07-25 and
      # 2026-08-15, so a change here is a real regression, not noise.
      #
      # What is NOT gated, deliberately:
      #   * answer quality — depends on a shared NIM endpoint whose latency and availability
      #     vary hour to hour; a red build would usually mean "NVIDIA is busy", not "we broke
      #     something". The harness already refuses to publish such runs (VALID/SUSPECT/INVALID).
      #   * retrieval-only — looks free, but /search embeds every query via Jina, so gating it
      #     would spend provider quota on each push.
      #   * NER F1 — a 13-entity corpus where one miss swings a per-type rate.
      #
      # --max-false-negatives 1 pins the ONE known ground-truth artefact (4.1.2/EQ-103,
      # documented in the harness). False positives still fail at any setting.
      # ---------------------------------------------------------------------
      - name: Gate — layer reachability
        if: steps.gate.outputs.ready == 'true'
        run: docker compose exec -T kairos-backend-api python benchmark/verify_layers.py

      - name: Gate — compliance gap-detection accuracy
        if: steps.gate.outputs.ready == 'true'
        run: |
          docker compose exec -T kairos-backend-api \
            python benchmark/run_compliance_eval.py --max-false-negatives 1

      - name: Dump logs on failure
        if: failure() && steps.gate.outputs.ready == 'true'
        run: docker compose --profile local-stores logs --tail=150

      - name: Tear down
        # Gate-scoped: when the job skips, no stack was started and no .env exists, so an
        # unconditional `compose down` fails the job on a no-op.
        if: always() && steps.gate.outputs.ready == 'true'
        run: docker compose --profile local-stores down -v
